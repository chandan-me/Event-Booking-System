apiVersion: v1
kind: Secret
metadata:
  name: eventpass-secrets
  namespace: eventpass
  labels:
    app.kubernetes.io/name: eventpass
type: Opaque
stringData:
  # MySQL Root & App Credentials
  MYSQL_ROOT_PASSWORD: "prod_root_secure_password_replace_me"
  DB_USER: "app_user"
  DB_PASSWORD: "app_user_secure_password_replace_me"
  
  # JWT Signing Key
  JWT_SECRET_KEY: "prod_jwt_super_secret_key_minimum_32_characters_long_for_hs256"
  
  # RabbitMQ Credentials
  RABBITMQ_USER: "event_user"
  RABBITMQ_PASSWORD: "event_rabbit_password_secure"
