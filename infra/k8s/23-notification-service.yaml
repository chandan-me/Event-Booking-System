apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: eventpass
  labels:
    app: notification-service
spec:
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: eventpass
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: eventpass/notification-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: APP_ENV
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "event_notification_db"
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: RABBITMQ_PASSWORD
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: SMTP_PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
