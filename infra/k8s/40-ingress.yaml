apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventpass-ingress
  namespace: eventpass
  labels:
    app.kubernetes.io/name: eventpass
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Idempotency-Key"
spec:
  rules:
    - host: eventpass.local
      http:
        paths:
          # Gateway API endpoints
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          # Gateway docs & OpenAPI schema
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          # Single Page Application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
