apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: eventpass
  labels:
    app: event-service
spec:
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: event-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: eventpass
  labels:
    app: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: eventpass/event-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: APP_ENV
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: eventpass-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "event_catalog_db"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eventpass-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
